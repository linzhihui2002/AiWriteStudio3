  skill: novel-review
  task_type: 审稿
  retrieval_profile: review
- intent: 去AI味
  triggers:
  - 去ai味
  - 去味
  - 太ai
  - 没人味
  - 像ai写的
  - ai腔
  - 太工整
  skill: human-linguistics
  task_type: 去AI味软审
  retrieval_profile: off
